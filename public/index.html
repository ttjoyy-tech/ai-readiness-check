<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>
/* Monochrome editorial, Montserrat Light capitals for headings, Lora italic never needed here. Square corners, hairlines, no shadows, no green. Ochre once per screen (header rule). Tier colours are a grey-to-denim-to-ink ramp built from tokens. */
:root{
  --bg:#fbfaf7; --surface:#efeeea; --ink:#15181a; --ink-soft:#5b5f60; --line:#dcdbd5;
  --accent:#2b5a87; --accent-ink:#ffffff; --accent-tint:#dfe8f0; --ochre:#b8731c; --sage:#d3ddd6;
  --t-lag:var(--ink-soft);
  --t-fol:color-mix(in srgb,var(--accent) 55%,var(--ink-soft));
  --t-cha:var(--accent);
  --t-pace:var(--ink);
  --tint-lag:color-mix(in srgb,var(--t-lag) 14%,var(--surface));
  --tint-fol:color-mix(in srgb,var(--t-fol) 14%,var(--surface));
  --tint-cha:color-mix(in srgb,var(--t-cha) 14%,var(--surface));
  --tint-pace:color-mix(in srgb,var(--t-pace) 14%,var(--surface));
  --f-body:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --f-display:var(--f-body); --f-mono:var(--f-body);
  --col:42rem; --col-wide:66rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101315; --surface:#181c1f; --ink:#f1efe9; --ink-soft:#a5a8a8; --line:#2a2f32;
    --accent:#8fb4d9; --accent-ink:#101315; --accent-tint:#1b2733; --ochre:#e0a04a; --sage:#25302b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#181c1f; --ink:#f1efe9; --ink-soft:#a5a8a8; --line:#2a2f32;
  --accent:#8fb4d9; --accent-ink:#101315; --accent-tint:#1b2733; --ochre:#e0a04a; --sage:#25302b;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:var(--col);margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wrap.wide{max-width:var(--col-wide)}
h1,h2,h3{font-family:var(--f-display);font-weight:300;text-transform:uppercase;letter-spacing:.05em;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(1.3rem,4vw,1.7rem);letter-spacing:.2em}

p{margin:0}
a{color:var(--accent)}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem;line-height:1.6}
.mono{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;justify-content:space-between;
  padding-block:20px 16px;margin-bottom:8px;border-bottom:2px solid var(--ochre)}
.tabs{display:flex;gap:18px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink-soft);font:500 .7rem var(--f-body);
  letter-spacing:.14em;text-transform:uppercase;padding:6px 0;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible+span,label.opt:has(input:focus-visible),a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:transparent;border:0;border-top:1px solid var(--line);padding:28px 0 0;display:flex;flex-direction:column;gap:18px;min-width:0}
.btn{font:500 .72rem var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}

legend{font-family:var(--f-body);font-weight:500;font-size:1rem;line-height:1.5;padding:0;margin-bottom:12px;text-wrap:balance}

.qs{display:flex;flex-direction:column;gap:30px}

.fields label{display:flex;flex-direction:column;gap:8px;font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
select{font:400 1rem var(--f-body);letter-spacing:0;text-transform:none;padding:11px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.score .n{font:300 4.5rem/1 var(--f-body);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:4px 12px;font:500 .68rem var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.pill.lag{background:var(--tint-lag);color:var(--ink)} .pill.fol{background:var(--tint-fol);color:var(--ink)}
.pill.cha{background:var(--tint-cha);color:var(--ink)} .pill.pace{background:var(--tint-pace);color:var(--ink)}
.pill{border-left:3px solid var(--ink-soft)}
.pill.lag{border-left-color:var(--t-lag)} .pill.fol{border-left-color:var(--t-fol)} .pill.cha{border-left-color:var(--t-cha)} .pill.pace{border-left-color:var(--t-pace)}
.prow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:6px 16px;align-items:center}
.prow .nm{font-weight:500;font-size:.9rem}
.track{position:relative;height:10px;
  background:linear-gradient(90deg,var(--tint-lag) 0 30.5%,var(--tint-fol) 30.5% 60.5%,var(--tint-cha) 60.5% 85.5%,var(--tint-pace) 85.5% 100%)}
.track .fill{position:absolute;inset:0 auto 0 0;transition:width .4s;border-right:2px solid var(--bg)}
.fill.lag{background:var(--t-lag)} .fill.fol{background:var(--t-fol)} .fill.cha{background:var(--t-cha)} .fill.pace{background:var(--t-pace)}
.scale{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:16px;font:500 .7rem var(--f-body);color:var(--ink-soft)}
.scale div{position:relative;height:14px}
.scale span{position:absolute;transform:translateX(-50%)}
.strip{display:flex;height:32px;border:1px solid var(--line)}
.strip div{display:flex;align-items:center;justify-content:center;font:500 .72rem var(--f-body);color:var(--bg);min-width:0;overflow:hidden}
.strip .lag{background:var(--t-lag)} .strip .fol{background:var(--t-fol)} .strip .cha{background:var(--t-cha)} .strip .pace{background:var(--t-pace)}
:root[data-theme="dark"] .strip .cha,:root[data-theme="dark"] .strip .fol{color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font:300 2.2rem/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px 10px 0;border-top:1px solid var(--line);white-space:nowrap}
th{font:500 .68rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
td.num,th.num{text-align:right}
ul.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.note{font-size:.82rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px}
.empty{border:1px solid var(--line);padding:26px;text-align:center;color:var(--ink-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.info{gap:26px}
.info section{display:flex;flex-direction:column;gap:10px}
.info ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.info a,.linkcard a{color:var(--accent);text-underline-offset:2px;overflow-wrap:anywhere}
.refs li{overflow-wrap:anywhere}
.linkcard{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:520px){.prow,.scale{grid-template-columns:1fr 44px}.prow .nm{grid-column:1/-1}.scale{display:none}.score .n{font-size:3.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* Branding and contact details come from /config.json (see README). These are the neutral defaults. */
const CFG={title:"AI Readiness Check",owner:"",organisation:"",email:"",website:"",bookingUrl:"",bookingHeading:"Want to talk it through?",bookingButton:"Book a time"};
async function loadConfig(){try{const r=await fetch("/config.json",{cache:"no-cache"});if(r.ok)Object.assign(CFG,await r.json())}catch(e){}}
/* ---------- Configuration ---------- */
const PILLARS=[
  {id:"use",  name:"Everyday use",        blurb:"How AI shows up in your real work",why:"Practice builds confidence",rt:"National AI Centre: AI adoption tracker",ru:"https://www.ai.gov.au/news-and-insights/ai-adoption-tracker",so:"Regular use is how you learn what AI does well and where it slips. Trying it once or twice doesn't build that."},
  {id:"skill",name:"Skills & judgement",  blurb:"Getting good results and knowing when to doubt them",why:"Checking catches errors",rt:"Workera: 2026 AI Skills Enterprise Benchmark",ru:"https://www.workera.ai/guides-reports/what-88-000-assessments-reveal-about-enterprise-ai-readiness",so:"AI can sound confident and be wrong. Checking its work is what stops mistakes reaching other people."},
  {id:"data", name:"Data & security",     blurb:"Handling information safely",why:"Protect people's information",rt:"OAIC: privacy and commercially available AI products",ru:"https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-the-use-of-commercially-available-ai-products",so:"Pasting the wrong thing into the wrong tool can expose customers, patients or your organisation."},
  {id:"resp", name:"Responsible use",     blurb:"Accountability, honesty and risk awareness",why:"Accountability stays human",rt:"Australian Government: Guidance for AI Adoption",ru:"https://www.industry.gov.au/publications/guidance-ai-adoption",so:"When AI helps decide something about a person, someone has to be able to explain it and answer for it."},
  {id:"mind", name:"Mindset & support",   blurb:"Learning habits and the backing you have",why:"Leadership enables change",rt:"Microsoft 2026 Work Trend Index, Australian findings",ru:"https://itbrief.com.au/story/microsoft-survey-warns-australian-firms-lag-on-ai-governance",so:"Even skilled people stall without time, permission and a leader who backs them."}
];
/* Each option is [text, credit]. Credit follows the Cisco method: 100 full, 25-50 partial, 0 none. */
const QUESTIONS=[
 {id:"q1",p:"use",t:"Think about the last two weeks. How has AI been part of your work or daily routine?",o:[
   ["Most days, built into how I work",100],["Most weeks, for a few routine tasks",50],["I use it personally, outside work",50],["Once or twice, mostly to see what it can do",25],["Not at all",0]]},
 {id:"q2",p:"skill",t:"An AI tool summarises a long report and the result reads well. What do you do before you share it?",o:[
   ["Check the key claims against the source and ask the tool to show where each came from",100],["Check the key figures and quotes against the source",50],["Read it through for anything that sounds off",25],["Share it. It reads well.",0]]},
 {id:"q3",p:"data",t:"You want AI help with a document that contains customer, client or other personal details. What do you do?",o:[
   ["Use only an approved tool, remove identifying details, and check the policy if unsure",100],["Remove names and sensitive details and use whichever tool is quickest",50],["Remove names, but leave the rest in",25],["Paste it in. The tool is only helping me.",0]]},
 {id:"q4",p:"resp",t:"An AI tool produces a recommendation that affects a person, such as a hire, a customer or a client. Who is accountable for it?",o:[
   ["A named person who reviews it, can explain it and can override it",100],["Me, but I'd rarely check it in detail",50],["It's shared and not really clear",25],["The tool. That's why we use it.",0]]},
 {id:"q5",p:"mind",t:"Your organisation hasn't set clear AI rules yet. What do you do?",o:[
   ["Raise it with leaders and offer to help shape a small, safe pilot",100],["Use AI carefully for personal learning and keep work data out of it",50],["Wait until someone tells me what is allowed",25],["Use whatever tool I like. No rules means no limits.",0]]}
];
const TEAMS=["Health & community services","Government & public sector","Education & research","Finance & professional services","Technology","Other private sector","Own business or consulting","Other"];
const LEVELS=["Emerging leader","Senior leader","Executive or board"];
const ACCESS=["Yes, approved tools","Limited or restricted","No, not allowed","Not sure"];
const TIERS=[
  {k:"Pacesetting",min:86,label:"Ready to lead",c:"pace",say:"You use AI confidently and safely, and others can learn from how you work."},
  {k:"Leading",min:61,label:"Hitting your stride",c:"cha",say:"You have solid habits in place. A few gaps are worth closing."},
  {k:"Building",min:31,label:"Building confidence",c:"fol",say:"You've started, but practice and guardrails are patchy."},
  {k:"Starting",min:0,label:"Early days",c:"lag",say:"AI isn't part of your work yet. Small, safe steps will move you quickly."}
];
const TIPS={
  use:["Pick one task you repeat every week and run it through an approved AI tool. Note the time saved and what you had to fix.","Write down one workflow that works for you and share it with your team."],
  skill:["Next time you use AI, give it context, an example and the format you want, then check key claims against the source.","Keep a short list of tasks where AI needs a human check, and share it."],
  data:["Find your organisation's list of approved AI tools and the rules for what data each may handle. Ask if you can't find it.","Make a habit of removing identifying details before you paste anything into an AI tool."],
  resp:["Agree with your team when and how you say AI helped with a piece of work.","For any AI-assisted decision about a person, name who reviews it and can override it."],
  mind:["Set aside 30 minutes a fortnight for hands-on practice with a real task.","Ask your manager what support, training or time exists, and share what you learn."]
};
const MIN_GROUP=5;
const BENCH_MIN=10;
/* Business page shown on the About tab. Fill in url (and name) to show the link. */
const BUSINESS={name:"",url:""};
const REFS=[
  {t:"Cisco AI Readiness Index methodology (the tiers and cut-offs this check adapts)",u:"https://www.cisco.com/c/m/en_us/solutions/ai/readiness-index/methodology.html"},
  {t:"National AI Centre, AI adoption tracker (everyday use)",u:"https://www.ai.gov.au/news-and-insights/ai-adoption-tracker"},
  {t:"Workera, 2026 AI Skills Enterprise Benchmark (skills and judgement)",u:"https://www.workera.ai/guides-reports/what-88-000-assessments-reveal-about-enterprise-ai-readiness"},
  {t:"Office of the Australian Information Commissioner, Guidance on privacy and the use of commercially available AI products (data and security)",u:"https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-the-use-of-commercially-available-ai-products"},
  {t:"Australian Government, Guidance for AI Adoption, October 2025 (responsible use)",u:"https://www.industry.gov.au/publications/guidance-ai-adoption"},
  {t:"Microsoft 2026 Work Trend Index, Australian findings, reported by IT Brief (mindset and support)",u:"https://itbrief.com.au/story/microsoft-survey-warns-australian-firms-lag-on-ai-governance"},
  {t:"NIST AI Risk Management Framework (general reference for governing AI)",u:"https://www.nist.gov/itl/ai-risk-management-framework"}
];
/* Published benchmarks. Organisation-level or survey-level, not individual scores; shown for context only. */
const BENCH={
  ciscoInaugural:{name:"Cisco AI Readiness Index, inaugural edition",dist:{Pacesetting:14,Leading:34,Building:48,Starting:4},note:"8,161 senior business and IT leaders; organisations with 500+ staff."},
  cisco2025:{name:"Cisco AI Readiness Index 2025",pacesetters:13,note:"Over 8,000 leaders, 30 markets. About 13% of organisations rated Pacesettings (score 86 or above)."},
  skillsoft2026:{name:"Skillsoft Workforce Readiness Report: AI Edition, June 2026",note:"2,000 workers in North America, UK and Germany. About 1 in 4 employees feel equipped for AI."},
  workera2026:{name:"Workera 2026 AI Skills Enterprise Benchmark",note:"88,753 assessments. 13% of employees assessed as Accomplished in agentic AI skills before any upskilling."}
};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tierOf=n=>TIERS.find(t=>n>=t.min);
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const r1=n=>Math.round(n*10)/10;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),3200)}

function compute(ans){
  const q={};QUESTIONS.forEach(x=>{q[x.id]=x.o[ans[x.id]][1]});
  const pillars={};
  PILLARS.forEach(p=>{const qs=QUESTIONS.filter(x=>x.p===p.id);pillars[p.id]=r1(avg(qs.map(x=>q[x.id])))});
  const overall=Math.round(avg(PILLARS.map(p=>pillars[p.id])));
  return {q,pillars,overall,tier:tierOf(overall).k};
}
function cleanRow(d){
  const num=v=>{v=Number(v);return isFinite(v)?Math.max(0,Math.min(100,v)):0};
  const q={},pillars={};
  QUESTIONS.forEach(x=>q[x.id]=num(d.q&&d.q[x.id]));
  PILLARS.forEach(p=>pillars[p.id]=num(d.pillars&&d.pillars[p.id]));
  const overall=Math.round(num(d.overall));
  return {ts:typeof d.ts==="string"?d.ts.slice(0,10):"",team:TEAMS.includes(d.team)?d.team:"Other",level:LEVELS.includes(d.level)?d.level:LEVELS[0],access:ACCESS.includes(d.access)?d.access:"Not sure",overall,tier:tierOf(overall).k,pillars,q};
}
function aggregate(rows){
  if(!rows.length)return null;
  const tierCounts={Pacesetting:0,Leading:0,Building:0,Starting:0};rows.forEach(r=>tierCounts[r.tier]++);
  const pill={};PILLARS.forEach(p=>pill[p.id]=avg(rows.map(r=>r.pillars[p.id])));
  const qavg={};QUESTIONS.forEach(x=>qavg[x.id]=avg(rows.map(r=>r.q[x.id])));
  return {n:rows.length,overall:avg(rows.map(r=>r.overall)),tierCounts,pill,qavg};
}
function groupRows(rows,key,list){
  return list.map(g=>{const rs=rows.filter(r=>r[key]===g);return {g,n:rs.length,avg:rs.length?avg(rs.map(r=>r.overall)):null}}).filter(x=>x.n>0);
}

/* ---------- State ---------- */
const ROOM=(()=>{try{const r=(new URLSearchParams(location.search).get("room")||"").toLowerCase().trim();if(/^[a-z0-9][a-z0-9-]{2,39}$/.test(r))return r;return ""}catch(e){return ""}})();
const SHARE_ROOM=ROOM||"open";
const S={shared:false,view:"take",step:0,team:"",level:"",access:"",ans:{},result:null,existing:null,db:null,user:null,dl:null,uid:null,canEdit:false,rows:[],saveMsg:"",loaded:false};
const STEPS=PILLARS.length+1;

/* ---------- Views ---------- */
function bandRow(label,v){
  const t=tierOf(Math.round(v));
  const pp=PILLARS.find(x=>x.name===label);
  return `<div class="prow"><div class="nm">${esc(label)}${pp?`<br><span class="muted small" style="font-weight:400">${esc(pp.why)}</span>`:""}</div>

let BM=null;
function benchCard(res){
  if(!BM)return "";

  let out=`<div class="card"><h3>How you compare</h3>`;
  const mixes=[];
  if(pub&&pub.tiers)mixes.push({label:pub.name+" (organisations)",dist:pub.tiers,total:100,pct:pub.tiers[t.k]});
  const ref=BM.reference;
  if(ref&&ref.tiers){const tot=Object.values(ref.tiers).reduce((x,y)=>x+y,0)||1;mixes.push({label:ref.label.charAt(0).toUpperCase()+ref.label.slice(1)+" ("+ref.n+" people)",dist:ref.tiers,total:tot,pct:Math.round((ref.tiers[t.k]||0)/tot*100)})}
  if(mixes.length){
    out+=`<p>Your result puts you in the <b>${esc(t.k)}</b> tier. Here is how each group is spread across the four tiers:</p>
      ${mixes.map(m=>`<div style="margin:12px 0"><div class="small muted" style="margin-bottom:6px">${esc(m.label)}: <b>${m.pct}%</b> in ${esc(t.k)}</div>${stripHTML(m.dist,m.total)}</div>`).join("")}${legendHTML()}

  }
  const groups=[];
  if(BM.reference&&BM.reference.overall!=null)groups.push(BM.reference);
  if(own&&own.n>=MIN_GROUP&&own.overall!=null)groups.push(own);
  if(groups.length){
    const cmp=g=>{const d=res.overall-Math.round(g.overall);const word=Math.abs(d)<=3?"in line with":d>0?"above":"below";return `<p>Your overall score of <b class="mono">${res.overall}</b> is ${word} the average of <b class="mono">${Math.round(g.overall)}</b> for ${esc(g.label)} (${g.n}).</p>`};
    out+=`<h3 style="margin-top:14px">Compared with other groups</h3>${groups.map(cmp).join("")}
      <div class="tablewrap"><table><thead><tr><th>Area</th><th class="num">You</th>${groups.map(g=>`<th class="num">${esc(g.short||"Average")} (${g.n})</th>`).join("")}</tr></thead><tbody>${PILLARS.map(p=>`<tr><td>${esc(p.name)}</td><td class="num mono">${Math.round(res.pillars[p.id])}</td>${groups.map(g=>`<td class="num mono">${g.areas&&g.areas[p.id]!=null?Math.round(g.areas[p.id]):"-"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>

  return out+`</div>`;
}

  XLSX.utils.book_append_sheet(wb,resp,"Responses");
  const col=i=>XLSX.utils.encode_col(i);
  const sum=[["Measure","Value"],["Responses",{f:`COUNTA(Responses!A2:A${last})`}],["Average score",{f:`AVERAGE(Responses!F2:F${last})`}]];
  TIERS.slice().reverse().forEach(t=>sum.push([t.k+" (count)",{f:`COUNTIF(Responses!G2:G${last},"${t.k}")`}]));
  sum.push([]);sum.push(["Area","Average"]);
  PILLARS.forEach((p,i)=>sum.push([p.name,{f:`AVERAGE(Responses!${col(7+i)}2:${col(7+i)}${last})`}]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"Summary");
  const bt=[["Sector","Responses","Average score"],...groupRows(rows,"team",TEAMS).map(x=>[x.g,x.n,x.n>=MIN_GROUP?Math.round(x.avg):"hidden (under "+MIN_GROUP+")"]),[],["Seniority","Responses","Average score"],...groupRows(rows,"level",LEVELS).map(x=>[x.g,x.n,x.n>=MIN_GROUP?Math.round(x.avg):"hidden (under "+MIN_GROUP+")"])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(bt),"By group");
  const bench=[["Source","Detail"],...Object.values(BENCH).map(b=>[b.name,b.note]),[],["Tier","Minimum score","Cisco label"],...TIERS.slice().reverse().map(t=>[t.k,t.min,t.label]),[],["Inaugural Cisco distribution","% of organisations"],...TIERS.slice().reverse().map(t=>[t.k,BENCH.ciscoInaugural.dist[t.k]])];
  
  const qs=[["Question ID","Area","Question","Answer option","Credit"]];
  QUESTIONS.forEach(q=>q.o.forEach(o=>qs.push([q.id,PILLARS.find(p=>p.id===q.p).name,q.t,o[0],o[1]])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(qs),"Questions");
  return wb;
}
function anchorSave(blob,name){if(/\.pdf$/i.test(name)&&!blob.type)blob=new Blob([blob],{type:"application/pdf"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function saveFile(name,data){
  try{if(S.dl)await S.dl.save({filename:name,data});else anchorSave(data instanceof Blob?data:new Blob([data]),name);toast("Saved "+name)}
  catch(e){if(e&&e.code==="declined")return;toast("Couldn't save the file: "+((e&&e.message)||"unavailable"))}
}

/* ---------- PDF of the result (matches the on-screen result: score, tier, areas, next steps) ---------- */
const RGB={lag:[91,95,96],fol:[65,92,118],cha:[43,90,135],pace:[21,24,26]};
function buildPDF(res){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=18,CW=W-2*M;
  const INK=[21,24,26],MUT=[91,95,96],LINE=[220,219,213],OCHRE=[184,115,28],SURF=[239,238,234],BRAND=[43,90,135];
  const tint=c=>c.map((v,i)=>Math.round(v*.14+SURF[i]*.86));
  const t=tierOf(res.overall);
  let y=M;
  const need=h=>{if(y+h>284){doc.addPage();y=M}};
  const txt=(s,x,yy,size,style,col,opt)=>{doc.setFont("helvetica",style||"normal");doc.setFontSize(size);doc.setTextColor(...(col||INK));doc.text(String(s),x,yy,opt)};
  const caps=(s,x,yy,size,col)=>{doc.setCharSpace(.6);txt(String(s).toUpperCase(),x,yy,size,"normal",col);doc.setCharSpace(0)};
  const para=(s,x,w,size,style,col,lh)=>{doc.setFont("helvetica",style||"normal");doc.setFontSize(size);doc.splitTextToSize(String(s),w).forEach(l=>{need(lh);txt(l,x,y,size,style,col);y+=lh})};
  const heading=s=>{need(18);y+=3;doc.setDrawColor(...LINE);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=8;caps(s,M,y,11,INK);y+=8};

  const brandName=CFG.owner||CFG.title;caps(brandName,M,y,10,BRAND);
  doc.setFont("helvetica","bold");doc.setCharSpace(.6);const bw0=doc.getTextWidth(brandName.toUpperCase())+brandName.length*.6;doc.setCharSpace(0);
  caps("|  AI Readiness Check",M+bw0+2,y,10,INK);
  txt(new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"}),W-M,y,9,"normal",MUT,{align:"right"});
  y+=4;doc.setDrawColor(...OCHRE);doc.setLineWidth(.8);doc.line(M,y,W-M,y);

  y+=22;
  doc.setFont("helvetica","normal");doc.setFontSize(54);
  const nW=doc.getTextWidth(String(res.overall));
  txt(res.overall,M,y,54,"normal",INK);
  txt("out of 100",M+nW+4,y,12,"normal",MUT);
  y+=9;
  doc.setCharSpace(.5);doc.setFont("helvetica","bold");doc.setFontSize(8.5);
  const pillText=(t.k+"  -  "+t.label).toUpperCase();
  const pw=doc.getTextWidth(pillText)+pillText.length*.5+10;
  doc.setCharSpace(0);
  doc.setFillColor(...tint(RGB[t.c]));doc.rect(M,y-5.2,pw,7.6,"F");
  doc.setFillColor(...RGB[t.c]);doc.rect(M,y-5.2,1.2,7.6,"F");
  doc.setCharSpace(.5);txt(pillText,M+5,y,8.5,"bold",INK);doc.setCharSpace(0);
  y+=10;
  para(t.say,M,CW,11,"normal",INK,5.8);

  heading("By area");
  const x0=M+52,bw=CW-52-14,bands=[30.5,30,25,14.5],bc=["lag","fol","cha","pace"];
  PILLARS.forEach(p=>{
    need(11);
    const v=res.pillars[p.id],pt=tierOf(Math.round(v));
    txt(p.name,M,y,10,"bold",INK);
    let bx=x0;
    bands.forEach((b,i)=>{doc.setFillColor(...tint(RGB[bc[i]]));doc.rect(bx,y-3.4,bw*b/100,3.8,"F");bx+=bw*b/100});
    doc.setFillColor(...RGB[pt.c]);doc.rect(x0,y-3.4,Math.max(1,bw*v/100),3.8,"F");
    txt(Math.round(v),W-M,y,10,"bold",INK,{align:"right"});
    y+=9;
  });
  [31,61,86].forEach(n=>txt(n,x0+bw*(n-.5)/100,y-3,7,"normal",MUT,{align:"center"}));
  y+=3;
  txt("Starting 0-30  |  Building 31-60  |  Leading 61-85  |  Pacesetting 86-100",M,y,8,"normal",MUT);
  y+=4;

  heading("Where to focus next");
  PILLARS.slice().sort((a,b)=>res.pillars[a.id]-res.pillars[b.id]).slice(0,2).forEach(p=>{
    need(26);
    txt(p.name+"  ("+Math.round(res.pillars[p.id])+")",M,y,10.5,"bold",INK);
    y+=5.8;
    TIPS[p.id].forEach(tip=>{
      const ls=doc.splitTextToSize(tip,CW-6);
      need(ls.length*5.2+2);
      txt("-",M+1,y,10,"normal",INK);
      ls.forEach(l=>{txt(l,M+6,y,10,"normal",INK);y+=5.2});
      y+=1.2;
    });
    y+=3;
  });

  need(26);
  y+=2;doc.setDrawColor(...LINE);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=5;
  para("This check is a short self-assessment and has not been formally validated. Treat the score as a snapshot and a conversation starter, not a measure of ability. Tiers and cut-offs follow the Cisco AI Readiness Index, which measures organisations rather than individuals. Your result is confidential and is not used to rate individual performance.",M,CW,8,"normal",MUT,4);
  y+=3;need(8);
  doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...BRAND);
  if(CFG.website)doc.textWithLink("Take the check yourself or share it with your team: "+CFG.website.replace(/^https?:\/\//,""),M,y,{url:CFG.website});
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setDrawColor(...LINE);doc.setLineWidth(.3);doc.line(M,287,W-M,287);
    txt(CFG.organisation||CFG.owner||"",M,292,8,"bold",BRAND);
    doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...MUT);
    const em=CFG.email||"",web=(CFG.website||"").replace(/^https?:\/\//,""),sep=(em&&web)?"   |   ":"";
    const ew=doc.getTextWidth(em),ww=doc.getTextWidth(web),sw=doc.getTextWidth(sep);
    const xe=W-M-ew,xs=xe-sw,xw=xs-ww;
    if(web)doc.textWithLink(web,xw,292,{url:CFG.website});
    doc.text(sep,xs,292);
    if(em)doc.textWithLink(em,xe,292,{url:"mailto:"+em});
  }
  return doc.output("arraybuffer");
}

/* ---------- Events ---------- */
document.addEventListener("click",async ev=>{
  const v=ev.target.closest("[data-view]");
  if(v){ev.preventDefault();S.view=v.dataset.view;try{location.hash=S.view==="results"||S.view==="about"?S.view:""}catch(e){}render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="start"){S.shared=false;S.step=0;S.result=null;S.ans={};S.team="";S.level="";S.access="";S.saveMsg="";S.view="take";render()}
  else if(act==="showprev"&&S.existing&&S.existing.full){S.result=S.existing.full;S.saveMsg="";render()}
  else if(act==="back"){if(S.step>0){S.step--}else{S.step=-1}render()}
  else if(act==="next"&&stepComplete()){
    if(S.step<STEPS-1){S.step++;render();window.scrollTo(0,0)}
    else{const res=compute(S.ans);S.result=res;S.saveMsg="Saving…";render();await saveResult(res);render();window.scrollTo(0,0)}
  }
  else if(act==="xlsx"){
    if(typeof XLSX==="undefined"){toast("The Excel library didn't load. Use the CSV button instead.");return}
    const out=XLSX.write(buildWorkbook(S.rows),{bookType:"xlsx",type:"array"});
    saveFile("ai-readiness-results.xlsx",new Blob([out],{type:"application/octet-stream"}));
  }
  else if(act==="share"){
    const ck=document.getElementById("shareok");if(!ck||!ck.checked||!S.result){toast("Tick the box first.");return}
    const r=S.result;b.disabled=true;
    try{
      const resp=await fetch("/api/ai-check/submit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({room:SHARE_ROOM,overall:r.overall,areas:r.pillars,sector:S.team,level:S.level,access:S.access})});
      if(!resp.ok)throw new Error(resp.status);
      S.shared=true;render();toast("Shared. Thank you.");
    }catch(e){b.disabled=false;toast("Could not share. Check your connection and try again.")}
  }
  else if(act==="pdf"){
    if(!window.jspdf){toast("The PDF library didn't load. Reload the page and try again.");return}
    if(!S.result)return;
    let out;try{out=buildPDF(S.result)}catch(e){toast("Couldn't build the PDF.");return}
    saveFile("ai-readiness-result-"+new Date().toISOString().slice(0,10)+".pdf",out);
  }
  else if(act==="csv")saveFile("ai-readiness-responses.csv",csvText(exportAOA(S.rows)));
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="shareok"){const sb=document.getElementById("sharebtn");if(sb)sb.disabled=!t.checked;return}
  if(t.id==="team"){S.team=t.value}
  else if(t.id==="level"){S.level=t.value}
  else if(t.id==="access"){S.access=t.value}
  else if(t.type==="radio"){S.ans[t.name]=Number(t.value);t.closest("fieldset").querySelectorAll("label.opt").forEach(l=>l.classList.toggle("on",l.contains(t)))}
  else return;
  const n=$("#next");if(n)n.disabled=!stepComplete();
});

/* ---------- Boot ---------- */
S.step=-1;
loadConfig().then(()=>{document.title=CFG.title;render()});
loadBenchmarks();
if(location.hash==="#about")S.view="about";
</script>
